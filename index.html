<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b20"><title>IQ Quest 100</title><style>
*{box-sizing:border-box}body{margin:0;background:#100b20;color:white;font-family:system-ui;padding:16px}.app{max-width:560px;margin:auto}.card{background:#1b1230;border:1px solid #ffffff20;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:13px;background:#9333ea;color:white;font-weight:800;margin:4px;cursor:pointer}.alt{background:#302044}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.grid button{margin:0;padding:12px 0}.muted{color:#c4b5d8}h1 span{color:#c084fc}.answer{display:block;width:100%;text-align:left;background:#302044;margin:8px 0}.good{background:#166534}.bad{background:#9f1239}.hide{display:none}
</style></head><body><div class="app"><header><h1>🧠 IQ <span>QUEST</span></h1><p class="muted">100 LEVEL · 1000 SAVOL</p><button id="lang">UZ / EN</button></header>
<section id="home" class="card"><h2 id="welcome">Miyangni sinab ko‘r!</h2><p id="stats" class="muted"></p><button id="continue">▶ Davom etish</button><button id="showLevels" class="alt">Barcha levellar</button></section>
<section id="levels" class="card hide"><button class="alt" onclick="home()">← Bosh sahifa</button><h2>Level tanla</h2><div id="grid" class="grid"></div></section>
<section id="game" class="card hide"><button class="alt" onclick="home()">← Bosh sahifa</button><p id="meta"></p><p>⏱ <b id="time">20</b>s　❤️ <b id="lives">3</b>　⭐ <b id="score">0</b></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" class="muted"></p><button id="next" class="hide">Keyingi savol →</button></section>
<section id="result" class="card hide"><h2 id="resultTitle"></h2><p id="resultText" class="muted"></p><button id="resultBtn">Davom etish</button><button class="alt" onclick="home()">Bosh sahifa</button></section>
</div><script>
let lang='uz',unlocked=+(localStorage.iq100Unlocked||1),completed=JSON.parse(localStorage.iq100Done||'{}'),level=1,i=0,score=0,lives=3,correct=0,timer=20,interval,locked=false,current;
const $=x=>document.getElementById(x);function show(id){['home','levels','game','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function home(){clearInterval(interval);$('stats').textContent=(lang==='uz'?'Ochiq level: ':'Unlocked level: ')+unlocked+'/100';show('home')}
function makeQuestion(L,I){
 let d=Math.min(10,Math.floor((L-1)/10)),kind=(L+I)%5,q,ans,exp;
 if(kind===0){let a=2+d+Math.floor(Math.random()*8),m=2+(d>5?1:0),s=[a,a*m,a*m*m];q=(lang==='uz'?'Keyingi sonni top: ':'Find the next number: ')+s.join(', ')+', …';ans=s[2]*m;exp=(lang==='uz'?'Har safar ':'Each time ')+m+(lang==='uz'+'')+'×; '+ans;}
 else if(kind===1){let a=12+d*4+Math.floor(Math.random()*20),b=2+d%5,c=2+Math.floor(Math.random()*8);q=`${a} + ${b} × ${c} = ?`;ans=a+b*c;exp=`${b} × ${c} + ${a} = ${ans}`;}
 else if(kind===2){let n=4+d+Math.floor(Math.random()*7);q=lang==='uz'?`${n} ta odam bir-biri bilan bir martadan qo‘l berishsa, nechta qo‘l berish bo‘ladi?`:`${n} people each shake hands once. How many handshakes?`;ans=n*(n-1)/2;exp=`${n} × ${n-1} ÷ 2 = ${ans}`;}
 else if(kind===3){let a=3+d+Math.floor(Math.random()*10);q=lang==='uz'?`Bir sonning 3 baravaridan 2 ayirilsa ${a*3-2} chiqadi. Son nechchi?`:`Three times a number minus 2 is ${a*3-2}. Find the number.`;ans=a;exp=`(${a*3-2}+2) ÷ 3 = ${a}`;}
 else {let a=5+d+Math.floor(Math.random()*10);q=lang==='uz'?`Qonuniyat: ${a}, ${a+2}, ${a+6}, ${a+12}, … Keyingi son?`:`Pattern: ${a}, ${a+2}, ${a+6}, ${a+12}, … Next?`;ans=a+20;exp=lang==='uz'?'Qo‘shimchalar +2, +4, +6, keyin +8.':'Add +2, +4, +6, then +8.';}
 let opts=[ans,ans+2+d,Math.max(0,ans-3-d),ans+7+d];opts=[...new Set(opts)];while(opts.length<4)opts.push(ans+opts.length+9);opts=opts.slice(0,4).sort(()=>Math.random()-.5);
 return {q,ans,opts,exp};
}
function start(L){level=L;i=0;score=0;lives=3;correct=0;show('game');ask()}
function ask(){clearInterval(interval);locked=false;timer=20;$('time').textContent=timer;$('lives').textContent=lives;$('score').textContent=score;$('meta').textContent=`LEVEL ${level} · ${lang==='uz'?'SAVOL':'QUESTION'} ${i+1}/10`;current=makeQuestion(level,i);$('question').textContent=current.q;$('feedback').textContent='';$('next').classList.add('hide');$('answers').innerHTML='';current.opts.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(v,b);$('answers').appendChild(b)});interval=setInterval(()=>{timer--;$('time').textContent=timer;if(timer<=0)choose(null,null)},1000)}
function choose(v,btn){if(locked)return;locked=true;clearInterval(interval);document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(+b.textContent===current.ans)b.classList.add('good')});if(v===current.ans){score+=10;correct++}else if(btn)btn.classList.add('bad');else lives--;$('score').textContent=score;$('lives').textContent=lives;$('feedback').textContent=(v===current.ans?'✅ ':'❌ ')+current.exp;$('next').classList.remove('hide');$('next').textContent=i===9||lives<=0?(lang==='uz'?'Natijani ko‘rish':'See results'):(lang==='uz'?'Keyingi savol →':'Next question →')}
function next(){if(!locked)return;i++;if(i>=10||lives<=0){finish();return}ask()}
function finish(){clearInterval(interval);let pass=correct>=7;completed[level]=pass;if(pass&&level===unlocked&&unlocked<100)unlocked++;localStorage.iq100Unlocked=unlocked;localStorage.iq100Done=JSON.stringify(completed);$('resultTitle').textContent=pass?(lang==='uz'?'Level ochildi! 🎉':'Level passed! 🎉'):(lang==='uz'?'Yana urinib ko‘r!':'Try again!');$('resultText').textContent=(lang==='uz'?'Natija: ':'Score: ')+score+'/100 · '+correct+'/10 '+(lang==='uz'?'to‘g‘ri. ':'correct. ')+(pass?(lang==='uz'?'Keyingi level ochildi.':'Next level unlocked.'):(lang==='uz'?'Kamida 7 ta to‘g‘ri kerak.':'You need at least 7 correct.'));$('resultBtn').textContent=pass&&level<100?(lang==='uz'?'Keyingi level':'Next level'):(lang==='uz'?'Qayta o‘ynash':'Retry');$('resultBtn').onclick=()=>start(pass&&level<100?level+1:level);show('result')}
function levels(){show('levels');$('grid').innerHTML='';for(let n=1;n<=100;n++){let b=document.createElement('button');b.textContent=completed[n]?'✓ '+n:n;b.disabled=n>unlocked;b.style.opacity=n>unlocked?'.35':'1';b.onclick=()=>start(n);$('grid').appendChild(b)}}
$('continue').onclick=()=>start(unlocked);$('showLevels').onclick=levels;$('next').onclick=next;$('lang').onclick=()=>{lang=lang==='uz'?'en':'uz';$('lang').textContent=lang==='uz'?'UZ / EN':'EN / UZ';$('welcome').textContent=lang==='uz'?'Miyangni sinab ko‘r!':'Challenge your mind!';home()};home();
</script></body></html>
